name: Validate WatchMind
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Show selected SDK and compiler
        run: |
          xcodebuild -version
          swift --version
      - name: Check translations and build progress behavior
        run: |
          python3 scripts/check-localizations.py
          python3 scripts/tests/test_setup_progress.py
      - name: Test core
        run: |
          ./scripts/check.sh
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iPhone and embedded Watch app without signing
        run: |
          set -o pipefail
          xcodebuild -project WatchMind.xcodeproj -scheme WatchMind \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Run native unit and UI smoke tests on an available iPhone simulator
        run: ./scripts/test-native.sh
      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-xcresults
          path: .build-logs/*.xcresult
          if-no-files-found: ignore
