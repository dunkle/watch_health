name: WatchMind
options:
  bundleIdPrefix: com.watchmind
  developmentLanguage: en
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: '0.10.0'
    WATCHMIND_APP_BUNDLE_ID: com.watchmind.app
    WATCHMIND_WATCH_BUNDLE_ID: $(WATCHMIND_APP_BUNDLE_ID).watchkitapp
    WATCHMIND_PRIVACY_POLICY_URL: ''
    WATCHMIND_SUPPORT_URL: ''
    WATCHMIND_OPERATOR_NAME: ''
packages:
  WatchMindCore:
    path: .
targets:
  WatchMind:
    type: application
    platform: iOS
    sources: [iOS, AppResources]
    dependencies:
      - package: WatchMindCore
      - target: WatchMindWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCHMIND_APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1'
    entitlements:
      path: Config/iOS.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: WatchMind
        WatchMindPrivacyPolicyURL: $(WATCHMIND_PRIVACY_POLICY_URL)
        WatchMindSupportURL: $(WATCHMIND_SUPPORT_URL)
        WatchMindOperatorName: $(WATCHMIND_OPERATOR_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHealthShareUsageDescription: 读取心率，仅在你开启观察时识别波动并邀请回顾，不用于医疗诊断。
        NSMicrophoneUsageDescription: 在你授权并开启观察后，心率变化触发录音，最长时长由你设置（默认60分钟），语音仅保存在本机。
        NSSpeechRecognitionUsageDescription: 在本机将你同意录制的语音转成文字；设备不支持离线转写时不会切换到云端。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  WatchMindWatch:
    type: application
    platform: watchOS
    sources: [Watch, AppResources]
    dependencies:
      - package: WatchMindCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCHMIND_WATCH_BUNDLE_ID)
        SKIP_INSTALL: YES
    entitlements:
      path: Config/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleDisplayName: WatchMind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(WATCHMIND_APP_BUNDLE_ID)
        NSHealthShareUsageDescription: 在你主动开始的运动会话中读取心率并检测波动。
        NSHealthUpdateUsageDescription: 将你主动开始的运动会话保存到健康。
        UIBackgroundModes: [workout-processing]
  WatchMindNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeTests]
    dependencies:
      - target: WatchMind
      - package: WatchMindCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCHMIND_APP_BUNDLE_ID).native-tests
        GENERATE_INFOPLIST_FILE: YES
  WatchMindUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: WatchMind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCHMIND_APP_BUNDLE_ID).ui-tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WatchMind:
    build:
      targets:
        WatchMind: all
        WatchMindWatch: all
    run:
      config: Debug
    test:
      gatherCoverageData: true
      targets:
        - name: WatchMindNativeTests
        - name: WatchMindUITests
